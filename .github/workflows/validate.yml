name: Validate reviewed cases
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/validate_cases.py
      - run: python3 scripts/validate_discovery.py
      - run: python3 scripts/validate_assessments.py
      - run: python3 -m unittest discover -s tests -p 'test_assess_evidence.py'
