name: Dashboard browser interaction QA
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "language.html"
      - "language.css"
      - "language.js"
      - "data/studies-language.json"
      - "data/cases.json"
      - "tests/dashboard.e2e.mjs"
      - ".github/workflows/dashboard-qa.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium browser test dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop and iPhone layouts
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/aiwild-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8765/ >/dev/null
          node tests/dashboard.e2e.mjs
      - name: Server log on failure
        if: failure()
        run: |
          if [ -f /tmp/aiwild-server.log ]; then cat /tmp/aiwild-server.log; else echo 'Dashboard server was not started'; fi
